; Yesoul_BLE — multi-ESP bridge from a Yesoul indoor bike to Garmin watches
; and indoor-cycling apps (Zwift, TrainerRoad, Wahoo SYSTM, etc.).
;
; Three deployment options (see README.md):
;   A — Standalone Zwift trainer:           1× ESP32-C6   →  pio run -e trainer_c6
;   B — Garmin watch only:                  2× WROOM-32   →  pio run -e power + -e speed
;   C — Garmin watch + Zwift simultaneously: 2× WROOM-32 + 1× C6  →  add -e trainer_c6 (or -e trainer on a 3rd WROOM-32)
;
; All envs build the same firmware; the role is selected by the
; -DDEVICE_ROLE_* build flag. See docs/ARCHITECTURE.md for topology and
; docs/JOURNEY.md for the empirical trail of decisions.
;
; Flash:
;     pio run -e power      -t upload --upload-port /dev/cu.usbserial-XXX   # CPS to Garmin
;     pio run -e speed      -t upload --upload-port /dev/cu.usbserial-YYY   # CSC to Garmin
;     pio run -e trainer    -t upload --upload-port /dev/cu.usbserial-ZZZ   # FTMS on WROOM-32
;     pio run -e trainer_c6 -t upload --upload-port /dev/cu.usbmodemNNN     # FTMS on C6 (recommended)

[env:power]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = h2zero/NimBLE-Arduino@^2.0
monitor_speed = 115200
build_flags =
	-DCORE_DEBUG_LEVEL=0
	-DDEVICE_ROLE_POWER

[env:speed]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = h2zero/NimBLE-Arduino@^2.0
monitor_speed = 115200
build_flags =
	-DCORE_DEBUG_LEVEL=0
	-DDEVICE_ROLE_SPEED

[env:trainer]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = h2zero/NimBLE-Arduino@^2.0
monitor_speed = 115200
build_flags =
	-DCORE_DEBUG_LEVEL=0
	-DDEVICE_ROLE_TRAINER

; Same TRAINER role as [env:trainer] above, but targeting the Seeed XIAO
; ESP32-C6 (BLE 5.3, on-board PCB antenna, USB-C, smaller form factor — and
; the chip you happen to have left over from the failed single-esp-experiment
; if you went down that path). Uses the pioarduino fork because the stock
; espressif32 platform's Arduino-ESP32 is too old to compile for C6.
[env:trainer_c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
; The C6's default partition table caps the app slot at 1.25 MB; with NimBLE
; 2.x + WiFi + ESP-NOW + three BLE services we land 528 bytes over that. Use
; the "huge_app" scheme (3 MB app, no OTA, smaller SPIFFS) to fit comfortably.
board_build.partitions = huge_app.csv
lib_deps = h2zero/NimBLE-Arduino@^2.5
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_flags =
	-DCORE_DEBUG_LEVEL=0
	-DDEVICE_ROLE_TRAINER

; The parser unit test runs on the host with the system compiler — see README.
