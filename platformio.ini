; Yesoul_BLE — single-ESP experiment branch.
;
; Same firmware as master's POWER role + SPEED role, but on ONE chip using
; BLE 5.0 extended advertising with two advertising instances at distinct
; random-static addresses. The watch sees them as two separate devices and
; pairs each under its respective sensor category, but they share one GATT
; server with both CPS and CSC services.
;
; If this works, dual-ESP + ESP-NOW relay (master branch) becomes redundant.
; If it doesn't, master is the known-good fallback.
;
; Flash:
;     pio run -e single -t upload --upload-port /dev/cu.usbserial-XXX

[env:single]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = h2zero/NimBLE-Arduino@^2.0
monitor_speed = 115200
build_flags =
	-DCORE_DEBUG_LEVEL=0
	-DCONFIG_BT_NIMBLE_EXT_ADV=1

; The parser unit test runs on the host with the system compiler — see README.
