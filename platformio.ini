; Yesoul_BLE — dual-ESP bridge from a Yesoul G1M Plus indoor bike to a Garmin
; epix 2 watch. One ESP runs the POWER role (CPS — power + cadence), the other
; runs the SPEED role (CSC — speed + distance, fed via ESP-NOW from the POWER
; ESP). See docs/ARCHITECTURE.md for the topology and docs/JOURNEY.md for the
; empirical trail of why we ended up here.
;
; Flash:
;     pio run -e power -t upload --upload-port /dev/cu.usbserial-XXX
;     pio run -e speed -t upload --upload-port /dev/cu.usbserial-YYY
;
; Run parser tests on the host:
;     pio run -e native

[env:power]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = h2zero/NimBLE-Arduino@^2.0
monitor_speed = 115200
build_flags =
	-DCORE_DEBUG_LEVEL=0
	-DDEVICE_ROLE_POWER

[env:speed]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = h2zero/NimBLE-Arduino@^2.0
monitor_speed = 115200
build_flags =
	-DCORE_DEBUG_LEVEL=0
	-DDEVICE_ROLE_SPEED

; The parser unit test runs on the host with the system compiler — see README.
