; Yesoul_BLE — multi-ESP bridge from a Yesoul G1M Plus indoor bike to:
;   - a Garmin epix 2 watch (POWER + SPEED roles, paired natively as power
;     meter + speed sensor)
;   - Zwift / TrainerRoad / Wahoo SYSTM / etc. (TRAINER role, FTMS smart
;     trainer)
; The POWER ESP owns the bike's BLE connection. SPEED and TRAINER receive
; parsed BikeFrames via ESP-NOW broadcast from the POWER ESP.
; See docs/ARCHITECTURE.md for topology, docs/JOURNEY.md for the journey.
;
; Flash:
;     pio run -e power   -t upload --upload-port /dev/cu.usbserial-XXX   # CPS
;     pio run -e speed   -t upload --upload-port /dev/cu.usbserial-YYY   # CSC
;     pio run -e trainer -t upload --upload-port /dev/cu.usbserial-ZZZ   # FTMS

[env:power]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = h2zero/NimBLE-Arduino@^2.0
monitor_speed = 115200
build_flags =
	-DCORE_DEBUG_LEVEL=0
	-DDEVICE_ROLE_POWER

[env:speed]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = h2zero/NimBLE-Arduino@^2.0
monitor_speed = 115200
build_flags =
	-DCORE_DEBUG_LEVEL=0
	-DDEVICE_ROLE_SPEED

[env:trainer]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = h2zero/NimBLE-Arduino@^2.0
monitor_speed = 115200
build_flags =
	-DCORE_DEBUG_LEVEL=0
	-DDEVICE_ROLE_TRAINER

; The parser unit test runs on the host with the system compiler — see README.
