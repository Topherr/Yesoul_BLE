; Yesoul_BLE — single-ESP experiment branch (XIAO ESP32-C6 target).
;
; Goal: collapse master's dual-ESP-with-ESP-NOW-relay onto ONE chip using
; BLE 5.0 extended advertising with two advertising instances at distinct
; random-static addresses. The watch sees them as two separate devices and
; pairs each under its respective sensor category; both share one GATT
; server with both CPS and CSC services. The empirical question — whether
; the watch trips on the shared GATT after pairing on a single-UUID
; advertisement — is the reason this branch exists.
;
; Hardware: Seeed XIAO ESP32-C6 (BLE 5.3, on-board PCB antenna + U.FL).
;
; Why a non-stock platform: PlatformIO's stock `platform = espressif32`
; ships an Arduino-ESP32 core too old to compile for ESP32-C6. The
; pioarduino fork tracks Arduino-ESP32 3.x and is what NimBLE-Arduino's
; own CI uses for C6 + EXT_ADV builds.
;
; Flash:
;     pio run -e single -t upload --upload-port /dev/cu.usbmodemXXX
;
; Why the original ESP32 (WROOM-32) is NOT supported here: NimBLE-Arduino
; rejects CONFIG_BT_NIMBLE_EXT_ADV=1 with `#error Extended advertising is
; not supported on ESP32` because that chip's BLE radio is 4.2 only. C3,
; S3, C6, H2 all support BLE 5.0 multi-advertising-set. See
; docs/SINGLE_ESP_ATTEMPT.md.

[env:single]
; Pin to pioarduino's stable release (auto-tracks the latest tagged stable build).
; Floating the default branch was flagged by review as risk for silent breakage.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
; Pinned to ^2.5 — earlier 2.3.x had C6-specific crash bugs fixed in 2.3.8/2.3.9.
lib_deps = h2zero/NimBLE-Arduino@^2.5
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_flags =
	-DCORE_DEBUG_LEVEL=0
	-DCONFIG_BT_NIMBLE_EXT_ADV=1

; The parser unit test runs on the host with the system compiler — see README.
